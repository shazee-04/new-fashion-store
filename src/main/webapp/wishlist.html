<body class="homepage">

<header-component></header-component>

<section class="py-5 my-5 min-vh-100" id="Wishlist">
    <div class="container">
        <div class="d-flex flex-wrap justify-content-between gap-3 mb-4">
            <div>
                <h2 class="text-uppercase mb-2 mt-0">My Wishlist</h2>
            </div>
            <div class="wishlist-summary-card p-3 px-md-4">
                <div class="summary-label text-uppercase">Wishlist Total</div>
                <div class="summary-value" id="wishlistNetTotal">LKR 0.00</div>
                <div class="summary-meta" id="wishlistItemCount">0 Items</div>
            </div>
        </div>

        <div class="wishlist-list-wrapper" id="wishlistSkeletons">
            <article class="border-0 p-0 mb-5">
                <div class="row g-5 align-items-center">
                    <div class="col-4 col-md-2">
                        <div class="skeleton" style="aspect-ratio: 1/1;"></div>
                    </div>
                    <div class="col-8 col-md-8">
                        <div class="skeleton p-2 pt-3 mb-2 w-75"></div>
                        <div class="skeleton p-2 mb-2 w-75 d-none d-md-block"></div>
                        <div class="skeleton p-2 w-50"></div>
                    </div>
                    <div class="col-12 col-md-2 d-flex justify-content-md-end gap-2">
                        <div class="skeleton p-3 w-100"></div>
                    </div>
                </div>
            </article>
            <article class="border-0 p-0 mb-5">
                <div class="row g-5 align-items-center">
                    <div class="col-4 col-md-2">
                        <div class="skeleton" style="aspect-ratio: 1/1;"></div>
                    </div>
                    <div class="col-8 col-md-8">
                        <div class="skeleton p-2 pt-3 mb-2 w-75"></div>
                        <div class="skeleton p-2 mb-2 w-75 d-none d-md-block"></div>
                        <div class="skeleton p-2 w-50"></div>
                    </div>
                    <div class="col-12 col-md-2 d-flex justify-content-md-end gap-2">
                        <div class="skeleton p-3 w-100"></div>
                    </div>
                </div>
            </article>
            <article class="border-0 p-0 mb-5">
                <div class="row g-5 align-items-center">
                    <div class="col-4 col-md-2">
                        <div class="skeleton" style="aspect-ratio: 1/1;"></div>
                    </div>
                    <div class="col-8 col-md-8">
                        <div class="skeleton p-2 pt-3 mb-2 w-75"></div>
                        <div class="skeleton p-2 mb-2 w-75 d-none d-md-block"></div>
                        <div class="skeleton p-2 w-50"></div>
                    </div>
                    <div class="col-12 col-md-2 d-flex justify-content-md-end gap-2">
                        <div class="skeleton p-3 w-100"></div>
                    </div>
                </div>
            </article>
        </div>

        <div class="wishlist-list-wrapper d-none" id="wishlistItems"></div>
        <div class="text-center py-5 my-5 d-none" id="wishlistEmpty">
            <h4 class="mb-3">Your wishlist is empty</h4>
            <p class="text-muted mb-4">Start browsing and save your favorite products.</p>
            <a class="btn btn-dark text-uppercase" href="shop.html">Continue Shopping</a>
        </div>
    </div>
</section>
