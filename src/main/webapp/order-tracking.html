    <meta content="ecommerce,fashion,store,about,clothing,accessories" name="keywords">

<body class="homepage">

<header-component></header-component>

<section class="py-5 my-5" id="order-tracking">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-6">
                <h2 class="section-title text-uppercase mb-2">Order Tracking</h2>
                <p>Please enter your Order ID and press the “Track” button. This was given to you on your receipt and in
                    the confirmation email you should have received.</p>
                <form class="form-group text-dark-emphasis py-3" id="order-tracking-form">
                    <div class="col-12 pb-3">
                        <label class="form-label" for="orderIdInput">Order ID</label>
                        <input class="form-control rounded-0 py-3" id="orderIdInput" name="orderId"
                               placeholder="Found in your order confirmation email"
                               required type="text">
                    </div>
                    <div class="col-12 pb-5">
                        <label class="form-label" for="orderEmailInput">Billing Email </label>
                        <input class="form-control rounded-0 py-3" id="orderEmailInput" name="email"
                               placeholder="Email you used during checkout."
                               required type="email">
                    </div>
                    <div class="col-12">
                        <button class="btn btn-dark btn-lg w-100 text-uppercase" id="trackOrderBtn" name="submit"
                                type="submit">Track
                        </button>
                    </div>
                </form>
                <div class="mt-4 d-none" id="orderTrackingResult">
                    <div class="border p-4 mb-4">
                        <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">
                            <div>
                                <h5 class="text-uppercase mb-1" id="orderCode">Order</h5>
                                <div class="text-muted small" id="orderDate">Date</div>
                            </div>
                            <div class="text-end">
                                <span class="p-1 px-2 btn fs-9 btn-primary text-uppercase"
                                      id="orderStatus">Status</span>
                                <div class="text-dark fw-semibold mt-2" id="orderTotal">LKR 0.00</div>
                            </div>
                        </div>
                        <div class="row mt-4">
                            <div class="col-md-6">
                                <h6 class="text-uppercase mb-2">Billing</h6>
                                <div class="text-muted small" id="orderBilling"></div>
                            </div>
                            <div class="col-md-6">
                                <h6 class="text-uppercase mb-2">Payment</h6>
                                <div class="text-muted small" id="orderPayment"></div>
                            </div>
                        </div>
                    </div>
                    <div>
                        <h6 class="text-uppercase mb-3">Items</h6>
                        <div id="orderItems"></div>
                    </div>
                </div>
                <div class="text-muted small mt-4 d-none" id="orderTrackingEmpty">No order details yet.</div>
            </div>
        </div>
    </div>
</section>

<footer-component></footer-component>

<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/plugins.js"></script>
<script src="https://unpkg.com/isotope-layout@3/dist/isotope.pkgd.min.js"></script>

<script defer src="js/footer.js"></script>

<script defer src="js/head.js"></script>

</body>
</html>
