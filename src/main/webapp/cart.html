    <meta content="telephone=no" name="format-detection">
    <meta content="yes" name="mobile-web-app-capable">
    <meta content="shazee.dev" name="author">

    <meta content="ecommerce,fashion,store,wishlist,clothing,accessories" name="keywords">
    <meta
            content="New Fashion Store - Your one-stop shop for the latest fashion trends. Discover a wide range of clothing, accessories, and more."
            name="description">

    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet">
    <script crossorigin="anonymous" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/vendor.css" rel="stylesheet" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet" type="text/css">

    <link href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" rel="stylesheet" type="text/css">

    <link href="css/style.css" rel="stylesheet" type="text/css">
</head>

<body class="homepage">

<header-component></header-component>

<section class="py-5 my-5 min-vh-100" id="Cart">
    <div class="container">
        <div class="row mb-4">
            <h2 class="text-uppercase mb-2 mt-0">My Cart</h2>
        </div>
        <div id="cartLoading">
            <div class="row g-4 align-items-start py-3">
                <div class="col-lg-8">
                    <div class="d-none d-md-block border-bottom pb-2 mb-2">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <h6 class="text-uppercase text-muted mb-0">Product</h6>
                            </div>
                            <div class="col-md-3 text-md-center">
                                <h6 class="text-uppercase text-muted mb-0">Quantity</h6>
                            </div>
                            <div class="col-md-2 text-md-center">
                                <h6 class="text-uppercase text-muted mb-0">Total</h6>
                            </div>
                            <div class="col-md-1 text-md-end d-none">
                                <h6 class="text-uppercase text-muted mb-0">Remove</h6>
                            </div>
                        </div>
                    </div>

                    <div class="list-group list-group-flush" id="cartSkeletons">
                        <div class="list-group-item px-0 py-3 cart-row-item">
                            <div class="row g-3 g-md-4 align-items-center">
                                <div class="col-4 col-md-2">
                                    <div class="skeleton cart-product-thumb" style="height: 170px;"></div>
                                </div>

                                <div class="col-8 col-md-4">
                                    <div class="skeleton mb-2" style="height: 20px; width: 90%;"></div>
                                    <div class="d-flex gap-2 mb-2">
                                        <div class="skeleton" style="height: 24px; width: 72px;"></div>
                                        <div class="skeleton" style="height: 24px; width: 88px;"></div>
                                    </div>
                                    <div class="skeleton" style="height: 14px; width: 55%;"></div>
                                </div>

                                <div class="col-6 col-md-3">
                                    <div class="skeleton mx-md-auto" style="height: 38px; max-width: 140px;"></div>
                                </div>

                                <div class="col-4 col-md-2 text-md-center">
                                    <div class="skeleton mx-md-auto" style="height: 16px; width: 100px;"></div>
                                </div>

                                <div class="col-2 col-md-1 text-end">
                                    <div class="skeleton ms-auto" style="height: 32px; width: 32px;"></div>
                                </div>
                            </div>
                        </div>

                        <div class="list-group-item px-0 py-3 cart-row-item">
                            <div class="row g-3 g-md-4 align-items-center">
                                <div class="col-4 col-md-2">
                                    <div class="skeleton cart-product-thumb" style="height: 170px;"></div>
                                </div>

                                <div class="col-8 col-md-4">
                                    <div class="skeleton mb-2" style="height: 20px; width: 90%;"></div>
                                    <div class="d-flex gap-2 mb-2">
                                        <div class="skeleton" style="height: 24px; width: 72px;"></div>
                                        <div class="skeleton" style="height: 24px; width: 88px;"></div>
                                    </div>
                                    <div class="skeleton" style="height: 14px; width: 55%;"></div>
                                </div>

                                <div class="col-6 col-md-3">
                                    <div class="skeleton mx-md-auto" style="height: 38px; max-width: 140px;"></div>
                                </div>

                                <div class="col-4 col-md-2 text-md-center">
                                    <div class="skeleton mx-md-auto" style="height: 16px; width: 100px;"></div>
                                </div>

                                <div class="col-2 col-md-1 text-end">
                                    <div class="skeleton ms-auto" style="height: 32px; width: 32px;"></div>
                                </div>
                            </div>
                        </div>

                        <div class="list-group-item px-0 py-3 cart-row-item">
                            <div class="row g-3 g-md-4 align-items-center">
                                <div class="col-4 col-md-2">
                                    <div class="skeleton cart-product-thumb" style="height: 170px;"></div>
                                </div>

                                <div class="col-8 col-md-4">
                                    <div class="skeleton mb-2" style="height: 20px; width: 90%;"></div>
                                    <div class="d-flex gap-2 mb-2">
                                        <div class="skeleton" style="height: 24px; width: 72px;"></div>
                                        <div class="skeleton" style="height: 24px; width: 88px;"></div>
                                    </div>
                                    <div class="skeleton" style="height: 14px; width: 55%;"></div>
                                </div>

                                <div class="col-6 col-md-3">
                                    <div class="skeleton mx-md-auto" style="height: 38px; max-width: 140px;"></div>
                                </div>

                                <div class="col-4 col-md-2 text-md-center">
                                    <div class="skeleton mx-md-auto" style="height: 16px; width: 100px;"></div>
                                </div>

                                <div class="col-2 col-md-1 text-end">
                                    <div class="skeleton ms-auto" style="height: 32px; width: 32px;"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card border-0 rounded-0 cart-summary-card">
                        <div class="card-body p-3 p-md-4">
                            <div class="skeleton mb-3" style="height: 12px; width: 32%;"></div>
                            <div class="skeleton mb-2" style="height: 14px; width: 100%;"></div>
                            <div class="skeleton mb-4" style="height: 22px; width: 45%;"></div>
                            <div class="skeleton" style="height: 48px; width: 100%;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-none" id="cartContent">
            <div class="row g-4 align-items-start py-3">
                <div class="col-lg-8">
                    <div class="d-none d-md-block border-bottom pb-2 mb-2">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <h6 class="text-uppercase text-muted mb-0">Product</h6>
                            </div>
                            <div class="col-md-3 text-md-center">
                                <h6 class="text-uppercase text-muted mb-0">Quantity</h6>
                            </div>
                            <div class="col-md-2 text-md-center">
                                <h6 class="text-uppercase text-muted mb-0">Total</h6>
                            </div>
                            <div class="col-md-1 text-md-end d-none">
                                <h6 class="text-uppercase text-muted mb-0">Remove</h6>
                            </div>
                        </div>
                    </div>

                    <div class="list-group list-group-flush d-none" id="cartItems">
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card border-0 rounded-0 cart-summary-card">
                        <div class="card-body p-3 p-md-4">
                            <div class="d-flex justify-content-between align-items-start pb-3">
                                <span class="text-uppercase small text-dark d-flex flex-column">
                                    Subtotal
                                    <span class="fs-8 text-lowercase text-muted">
                                        Taxes and shipping calculated at checkout
                                    </span>
                                </span>
                                <span class="text-dark fw-medium" id="cartNetTotal">LKR 0.00</span>
                            </div>

                            <div class="d-grid gap-2">
                                <a class="btn btn-dark btn-lg text-uppercase" href="checkout.html" id="cartCheckoutBtn">
                                    Check out
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center py-5 my-5 d-none" id="cartEmpty">
            <h4 class="mb-3">Your cart is empty</h4>
            <p class="text-muted mb-4">Looks like you haven’t added any products yet.</p>
            <a class="btn btn-dark text-uppercase" href="shop.html">Continue Shopping</a>
        </div>
    </div>
</section>

<footer-component></footer-component>

<script src="assets/js/script.js"></script>

<script defer src="js/auth.js"></script>

<script defer src="js/header.js"></script>
<script defer src="js/footer.js"></script>

<script defer src="js/head.js"></script>
<script defer src="js/script.js"></script>
<script defer src="js/cart-wishlist.js"></script>
<script defer src="js/cart.js"></script>

</body>

</html>
