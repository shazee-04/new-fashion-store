<!DOCTYPE html>
<html lang="en">

<head>
    <title>New Fashion Store | checkout</title>

    <meta charset="utf-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="telephone=no" name="format-detection">
    <meta content="yes" name="mobile-web-app-capable">
    <meta content="shazee.dev" name="author">

    <meta content="ecommerce,fashion,store,wishlist,clothing,accessories" name="keywords">
    <meta
            content="New Fashion Store - Your one-stop shop for the latest fashion trends. Discover a wide range of clothing, accessories, and more."
            name="description">

    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet">
    <script crossorigin="anonymous" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/vendor.css" rel="stylesheet" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link
            href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Marcellus&display=swap"
            rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" rel="stylesheet" type="text/css">

    <link href="css/style.css" rel="stylesheet" type="text/css">
</head>

<body class="homepage">

<header-component></header-component>

<section class="py-5 my-5 min-vh-100" id="Checkout">
    <div class="container">
        <div class="row mb-4">
            <div class="col-12">
                <h2 class="text-uppercase mb-0 mt-0">Checkout</h2>
            </div>
        </div>
        <form class="row g-4 g-lg-5" id="checkoutForm" novalidate>
            <div class="col-lg-8">
                <div class="card border-0 border-top rounded-0 checkout-card h-100">
                    <div class="card-body py-3 py-md-4 py-xl-5 px-0">
                        <h4 class="fs-4 text-dark mb-4 text-uppercase">Billing Details</h4>
                        <div class="row g-3 g-md-4">
                            <div class="col-md-6">
                                <label class="form-label" for="fname">First Name*</label>
                                <input class="form-control" id="fname" name="firstname" required type="text">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="lname">Last Name*</label>
                                <input class="form-control" id="lname" name="lastname" required type="text">
                            </div>

                            <div class="col-12">
                                <label class="form-label" for="cname">Company Name (Optional)</label>
                                <input class="form-control" id="cname" name="companyname" type="text">
                            </div>

                            <div class="col-12">
                                <label class="form-label" for="country">Country / Region*</label>
                                <select aria-label="Country / Region" class="form-select" id="country" required>
                                    <option hidden selected value="">Select country</option>
                                    <option value="us">United States</option>
                                    <option value="uk">UK</option>
                                    <option value="au">Australia</option>
                                    <option value="ca">Canada</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label class="form-label" for="addressLine1">Street Address*</label>
                                <input class="form-control mb-3" id="addressLine1" name="addressLine1"
                                       placeholder="House number and street name" required type="text">
                                <label for="addressLine2"></label>
                                <input class="form-control" id="addressLine2" name="addressLine2"
                                       placeholder="Apartment, suite, etc. (optional)" type="text">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="city">Town / City*</label>
                                <input class="form-control" id="city" name="city" required type="text">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="state">State*</label>
                                <select aria-label="State" class="form-select" id="state" required>
                                    <option hidden selected value="">Select state</option>
                                    <option value="fl">Florida</option>
                                    <option value="ny">New York</option>
                                    <option value="il">Chicago</option>
                                    <option value="tx">Texas</option>
                                    <option value="sj">San Jose</option>
                                    <option value="hs">Houston</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="zip">Zip Code*</label>
                                <input class="form-control" id="zip" name="zip" required type="text">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="phone">Phone*</label>
                                <input class="form-control" id="phone" name="phone" required type="text">
                            </div>

                            <div class="col-12">
                                <label class="form-label" for="email">Email Address*</label>
                                <input class="form-control" id="email" name="email" required type="email">
                            </div>

                            <div class="col-12 mt-5 border-top py-4">
                                <label class="form-label" for="orderNotes">Order Notes (Optional)</label>
                                <textarea class="form-control" id="orderNotes" name="orderNotes"
                                          placeholder="Notes about your order. E.g. special notes for delivery."></textarea>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <div class="col-lg-4">
                <div class="card border-0 rounded-0 checkout-summary-card position-sticky">
                    <div class="card-body p-3 p-md-4 py-xl-5">
                        <h4 class="fs-4 text-dark mb-4 text-uppercase">Order Summary</h4>

                        <div
                                class="d-flex align-items-center py-1 text-dark text-uppercase small checkout-summary-row border-animation-left">
                            <a class="item-anchor link-underline mb-0" data-bs-toggle="collapse"
                               href="#collapseCartList">
                                <span>3 Products. 12 items</span>
                            </a>
                        </div>
                        <div class="collapse" id="collapseCartList">
                            <div class="px-2 pb-3">
                                <div class="d-flex justify-content-between align-items-center fs-7 text-uppercase">
                                    <span>Product 1</span>
                                    <span>LKR 1,000.00</span>
                                </div>
                                <div class="d-flex justify-content-between align-items-center fs-7 text-uppercase">
                                    <span>Product 1</span>
                                    <span>LKR 1,000.00</span>
                                </div>
                            </div>
                        </div>

                        <div
                                class="d-flex justify-content-between align-items-center pb-1 text-dark text-uppercase small checkout-summary-row">
                            <span>Subtotal</span>
                            <span class="fw-normal">LKR 2,370.00</span>
                        </div>
                        <div
                                class="d-flex justify-content-between align-items-cente text-dark text-uppercase small checkout-summary-row">
                            <span>Shipping Fee</span>
                            <span class="fw-normal">LKR 350.00</span>
                        </div>
                        <div
                                class="d-flex justify-content-between align-items-center py-3 text-dark border-bottom text-uppercase small checkout-summary-row">
                            <span class="fw-medium">Total</span>
                            <span class="fw-medium">$2,370.00</span>
                        </div>

                        <div class="list-group list-group-flush mt-4">
                            <label class="list-group-item payment-option" for="paymentPayHere">
                                <input checked class="form-check-input flex-shrink-0" id="paymentPayHere"
                                       name="paymentMethod" type="radio" value="bank-transfer">
                                <div class="d-flex align-items-center justify-content-between w-100 gap-2">
                                        <span class="fs-6 text-dark text-uppercase" style="line-height: normal;">
                                            PayHere (Online)
                                        </span>
                                    <span>
                                            <img alt="PayHere" class="ms-2" height="32"
                                                 src="assets/images/brand/other/payhere.png">
                                        </span>
                                </div>
                            </label>
                        </div>

                        <div class="list-group list-group-flush">
                            <label class="list-group-item payment-option" for="paymentKOKO">
                                <input checked class="form-check-input flex-shrink-0" id="paymentKOKO"
                                       name="paymentMethod" type="radio" value="bank-transfer">
                                <div class="d-flex align-items-center justify-content-between w-100 gap-2">
                                        <span class="fs-6 text-dark text-uppercase" style="line-height: normal;">
                                            KOKO (Online | Installments)
                                        </span>
                                </div>
                            </label>
                        </div>

                        <div class="list-group list-group-flush mb-3">
                            <label class="list-group-item payment-option" for="paymentCOD">
                                <input checked class="form-check-input flex-shrink-0" id="paymentCOD"
                                       name="paymentMethod" type="radio" value="bank-transfer">
                                <div class="d-flex align-items-center justify-content-between w-100 gap-2">
                                        <span class="fs-6 text-dark text-uppercase" style="line-height: normal;">
                                            Cash on Delivery (COD)
                                        </span>
                                </div>
                            </label>
                        </div>

                        <div class="d-grid">
                            <button class="btn btn-dark btn-lg text-uppercase" name="submit" type="submit">Place an
                                order
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</section>

<footer-component></footer-component>

<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/plugins.js"></script>
<script src="https://unpkg.com/isotope-layout@3/dist/isotope.pkgd.min.js"></script>
<script src="assets/js/SmoothScroll.js"></script>
<script src="https://cdn.jsdelivr.net/npm/toastify-js" type="text/javascript"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
<script src="assets/js/script.js"></script>

<script defer src="js/helper.js"></script>
<script defer src="js/auth.js"></script>

<script defer src="js/header.js"></script>
<script defer src="js/footer.js"></script>

<script defer src="js/head.js"></script>
<script defer src="js/script.js"></script>
<script defer src="js/checkout.js"></script>

</body>

</html>
