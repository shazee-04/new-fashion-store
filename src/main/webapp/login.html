    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="mobile-web-app-capable" content="yes">

    <meta name="keywords" content="ecommerce,fashion,store,login,clothing,accessories">
    <meta name="description"
          content="New Fashion Store - Your one-stop shop for the latest fashion trends. Discover a wide range of clothing, accessories, and more.">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" type="text/css" href="assets/css/vendor.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css">
    <link rel="stylesheet" type="text/css" href="assets/css/style.css">

            href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Marcellus&display=swap"

    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>

<body class="homepage">

<header-component></header-component>

<!-- Login form section -->
<section class="min-vh-100 d-flex align-items-center">
    <div class="container-sm">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-6">
                <h2 class="section-title text-uppercase mt-0">Login</h2>

                <form id="login-form" class="form-group row text-dark-emphasis">
                    <div class="col-12 pb-3">
                        <label for="email">Email address</label>
                        <input type="text" id="email" placeholder="Enter your email" class="form-control">
                        <span class="error-msg" id="emailError"></span>
                    </div>
                    <div class="col-12 pb-3">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password" class="form-control">
                        <span class="error-msg" id="passwordError"></span>
                    </div>
                    <div class="col-12 pb-4">
                        <input type="checkbox" id="rememberMe" class="form-check-input shadow-none">
                        <label for="rememberMe" class="fs-6 text-muted opacity-75">Remember me</label>
                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn btn-dark btn-large text-uppercase pb-3  mt-2" id="loginBtn">
                            Continue
                        </button>
                    </div>
                    <div class="border-animation-left fs-6 py-1">
                        <a href="register.html" class="item-anchor text-dark-emphasis">
                            Doesn't have an account? Register
                            <i class="bi bi-arrow-right"></i>
                        </a>
                    </div>
                </form>

            </div>
        </div>
    </div>
</section>

<footer-component></footer-component>

<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/plugins.js"></script>
<script src="assets/js/SmoothScroll.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
<script src="assets/js/script.js"></script>

<script src="js/helper.js" defer></script>
<script src="js/auth.js" defer></script>

<script src="js/header.js" defer></script>
<script src="js/footer.js" defer></script>

<script src="js/head.js" defer></script>
<script src="js/script.js" defer></script>
<script src="js/login.js" defer></script>
</body>

</html>
