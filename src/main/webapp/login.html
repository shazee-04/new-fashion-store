<!-- Breadcrumb -->
<section class="hero-section bg-light py-4">
    <div class="hero-content">
        <div class="container">
            <div class="row">
                <div class="text-center">
                    <div class="breadcrumbs">

<!-- Login form section -->
<section class="pb-5 pt-5 mb-4 min-vh-100">
    <div class="container-sm">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-6">
                <h2 class="section-title text-uppercase">Login</h2>

                <form id="login-form" class="form-group row text-dark-emphasis">
                    <div class="col-12 pb-3">
                        <label for="email">Email address</label>
                        <input type="text" id="email" placeholder="Enter your email" class="form-control">
                        <span class="error-msg" id="emailError"></span>
                    </div>
                    <div class="col-12 pb-3">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password" class="form-control">
                        <span class="error-msg" id="passwordError"></span>
                    </div>
                    <div class="col-12 pb-4">
                        <input type="checkbox" id="rememberMe" class="form-check-input shadow-none">
                        <label for="rememberMe" class="fs-6 text-muted opacity-75">Remember me</label>
                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn btn-dark btn-large text-uppercase pb-3  mt-2" id="loginBtn">
                            Continue
                        </button>
                    </div>
                    <div class="border-animation-left fs-6 py-1">
                        <a href="register.html" class="item-anchor text-dark-emphasis">
                            Doesn't have an account? Register
                            <i class="bi bi-arrow-right"></i>
                        </a>
                    </div>
                </form>

            </div>
        </div>
    </div>
</section>

                </div>
                <form id="newsletter-form" class="d-flex flex-wrap gap-2">
                    <label for="newsletter-email"></label>
                    <input type="text" id="newsletter-email" placeholder="Your email addresss"
                           class="form-control form-control-lg">

                    <button class="btn btn-dark btn-lg text-uppercase w-100">Sign Up</button>
                </form>
            </div>
        </div>
    </div>
</section>
