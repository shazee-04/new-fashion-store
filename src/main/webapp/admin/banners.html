<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Dashboard | Homepage Banners</title>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;700&family=Marcellus&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" rel="stylesheet" type="text/css">
    <link href="css/admin.css" rel="stylesheet">
</head>
<body>

<div class="admin-wrapper">
    <!-- Sidebar navigation -->
    <admin-sidebar id="admin-sidebar-container"></admin-sidebar>

    <!-- Content Workspace -->
    <div class="admin-content-area">
        <!-- Top navbar -->
        <admin-navbar title="Homepage Banners"></admin-navbar>

        <!-- Main Workspace -->
        <div class="admin-main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="m-0">Manage Promotional Banners</h4>
                <button class="btn btn-dark" id="add-banner-btn">
                    <i class="bi bi-plus-lg me-2"></i> Add Banner
                </button>
            </div>

            <!-- Banners Table -->
            <div class="table-responsive">
                <table class="table admin-table align-middle">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Banner Image</th>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Target URL</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="banners-table-body">
                    <tr>
                        <td class="text-center py-4" colspan="7">
                            <div class="spinner-border spinner-border-sm text-dark" role="status"></div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Banner Save/Edit Modal -->
<div aria-hidden="true" aria-labelledby="bannerModalLabel" class="modal fade" id="bannerModal" tabindex="-1">
    <div class="modal-dialog modal-md modal-dialog-centered">
        <div class="modal-content rounded-0">
            <div class="modal-header">
                <h5 class="modal-title" id="bannerModalLabel">Add Banner</h5>
                <button aria-label="Close" class="btn-close shadow-none" data-bs-dismiss="modal" type="button"></button>
            </div>
            <div class="modal-body">
                <form id="banner-form">
                    <input id="banner-id" type="hidden" value="0">

                    <div class="mb-3">
                        <label class="form-label" for="banner-title">Banner Title</label>
                        <input class="form-control" id="banner-title" placeholder="Enter main heading" required
                               type="text">
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="banner-desc">Description / Subtitle</label>
                        <input class="form-control" id="banner-desc" placeholder="Enter supporting description text"
                               type="text">
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-8">
                            <label class="form-label" for="banner-url">Click Target URL</label>
                            <input class="form-control" id="banner-url" placeholder="shop.html?category=men"
                                   type="text">
                        </div>
                        <div class="col-4">
                            <label class="form-label" for="banner-status">Status</label>
                            <select class="form-select" id="banner-status" required>
                                <option value="1">Active</option>
                                <option value="2">Inactive</option>
                            </select>
                        </div>
                    </div>

                    <!-- Banner Image Upload -->
                    <div class="mb-2">
                        <label class="form-label d-block">Banner Background Image</label>
                        <div class="p-3 border border-dashed text-center c-precision" id="banner-drop-area"
                             style="background-color: #fafafa; border-style: dashed !important;">
                            <i class="bi bi-image fs-3 text-muted"></i>
                            <p class="mb-0 mt-1 small">Click or drag image file here</p>
                            <input accept="image/*" class="d-none" id="banner-image-file" type="file">
                        </div>

                        <input id="banner-image-path" type="hidden" value="">

                        <!-- Uploaded Preview -->
                        <div class="mt-3 text-center d-none" id="banner-preview-box">
                            <img class="img-fluid border" id="banner-preview-img" src=""
                                 style="max-height: 140px; object-fit: cover; width: 100%;">
                            <button class="btn btn-sm btn-outline-danger mt-2 py-1 px-3" id="remove-banner-img-btn"
                                    type="button">Remove Image
                            </button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-light" data-bs-dismiss="modal" type="button">Cancel</button>
                <button class="btn btn-dark" id="save-banner-submit" type="button">Save Banner</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/toastify-js" type="text/javascript"></script>

<script src="js/admin-shared.js"></script>
<script src="js/banners.js"></script>
</body>
</html>
