<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Dashboard | Store Attributes</title>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;700&family=Marcellus&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" rel="stylesheet" type="text/css">
    <link href="css/admin.css" rel="stylesheet">
</head>
<body>

<div class="admin-wrapper">
    <!-- Sidebar navigation -->
    <admin-sidebar id="admin-sidebar-container"></admin-sidebar>

    <!-- Content Workspace -->
    <div class="admin-content-area">
        <!-- Top navbar -->
        <admin-navbar title="Store Attributes"></admin-navbar>

        <!-- Main Workspace -->
        <div class="admin-main-content">
            <h4 class="mb-4">Manage Catalog Attributes</h4>

            <div class="row g-4">
                <!-- 1. Categories Column -->
                <div class="col-12 col-md-6">
                    <div class="card border-0 rounded-0 shadow-sm p-4 h-100">
                        <h5 class="border-bottom pb-2 mb-3">Product Categories</h5>

                        <form class="mb-4" id="add-category-form">
                            <div class="input-group">
                                <input class="form-control" id="new-category-name" placeholder="New Category Name"
                                       required type="text">
                                <button class="btn btn-dark" type="submit">Add</button>
                            </div>
                        </form>

                        <div class="table-responsive p-0 border-0 shadow-none"
                             style="max-height: 250px; overflow-y: auto;">
                            <table class="table admin-table">
                                <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Category Name</th>
                                </tr>
                                </thead>
                                <tbody id="categories-table-body">
                                <tr>
                                    <td class="text-center text-muted" colspan="2">Loading...</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- 2. Brands Column -->
                <div class="col-12 col-md-6">
                    <div class="card border-0 rounded-0 shadow-sm p-4 h-100">
                        <h5 class="border-bottom pb-2 mb-3">Store Brands</h5>

                        <form class="mb-4" id="add-brand-form">
                            <div class="mb-3">
                                <label class="form-label" for="new-brand-name">Brand Name</label>
                                <input class="form-control" id="new-brand-name" placeholder="Enter Brand Name"
                                       required type="text">
                            </div>

                            <!-- Brand logo upload -->
                            <div class="row align-items-end g-2">
                                <div class="col-8">
                                    <label class="form-label small text-muted">Brand Logo Path (Optional)</label>
                                    <input class="form-control" id="new-brand-logo-path" placeholder="No file selected" readonly
                                           type="text">
                                </div>
                                <div class="col-4">
                                    <button class="btn btn-outline-dark w-100" id="upload-brand-logo-btn" type="button">
                                        Upload
                                    </button>
                                    <input accept="image/*" class="d-none" id="brand-logo-file" type="file">
                                </div>
                            </div>

                            <button class="btn btn-dark w-100 mt-3" type="submit">Add Brand</button>
                        </form>

                        <div class="table-responsive p-0 border-0 shadow-none"
                             style="max-height: 250px; overflow-y: auto;">
                            <table class="table admin-table">
                                <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Logo</th>
                                    <th>Brand Name</th>
                                </tr>
                                </thead>
                                <tbody id="brands-table-body">
                                <tr>
                                    <td class="text-center text-muted" colspan="3">Loading...</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- 3. Colors Column -->
                <div class="col-12 col-md-6">
                    <div class="card border-0 rounded-0 shadow-sm p-4 h-100">
                        <h5 class="border-bottom pb-2 mb-3">Product Colors</h5>

                        <form class="mb-4" id="add-color-form">
                            <div class="row g-2 align-items-end">
                                <div class="col-6">
                                    <label class="form-label" for="new-color-name">Color Name</label>
                                    <input class="form-control" id="new-color-name" placeholder="e.g. Sapphire Blue"
                                           required type="text">
                                </div>
                                <div class="col-4">
                                    <label class="form-label" for="new-color-code">Hex Code</label>
                                    <input class="form-control form-control-color w-100" id="new-color-code"
                                           required type="color" value="#111111">
                                </div>
                                <div class="col-2">
                                    <button class="btn btn-dark w-100" type="submit">Add</button>
                                </div>
                            </div>
                        </form>

                        <div class="table-responsive p-0 border-0 shadow-none"
                             style="max-height: 250px; overflow-y: auto;">
                            <table class="table admin-table">
                                <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Color Preview</th>
                                    <th>Color Name</th>
                                    <th>Hex Code</th>
                                </tr>
                                </thead>
                                <tbody id="colors-table-body">
                                <tr>
                                    <td class="text-center text-muted" colspan="4">Loading...</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- 4. Sizes Column -->
                <div class="col-12 col-md-6">
                    <div class="card border-0 rounded-0 shadow-sm p-4 h-100">
                        <h5 class="border-bottom pb-2 mb-3">Product Sizes</h5>

                        <form class="mb-4" id="add-size-form">
                            <div class="input-group">
                                <input class="form-control" id="new-size-name" placeholder="e.g. XL, 32, Large"
                                       required type="text">
                                <button class="btn btn-dark" type="submit">Add</button>
                            </div>
                        </form>

                        <div class="table-responsive p-0 border-0 shadow-none"
                             style="max-height: 250px; overflow-y: auto;">
                            <table class="table admin-table">
                                <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Size Label</th>
                                </tr>
                                </thead>
                                <tbody id="sizes-table-body">
                                <tr>
                                    <td class="text-center text-muted" colspan="2">Loading...</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/toastify-js" type="text/javascript"></script>

<script src="js/admin-shared.js"></script>
<script src="js/attributes.js"></script>
</body>
</html>
