<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Fashion Store | Admin Access Redirect</title>
    <script src="js/admin-shared.js"></script>
</head>
<body>
<div style="font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #f5f6f8; color: #333;">
    <div style="text-align: center; padding: 2rem; background: #ffffff; border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.03);">
        <div style="border: 3px solid #f3f3f3; border-top: 3px solid #333; border-radius: 50%; width: 30px; height: 30px; display: inline-block; animation: spin 1s linear infinite; margin-bottom: 1rem;"></div>
        <h3 style="margin: 0 0 0.5rem 0; font-weight: 500;">Verifying Credentials</h3>
        <p style="margin: 0; color: #777; font-size: 0.9rem;">Checking authorization settings...</p>
    </div>
</div>
<style>
    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }
        100% {
            transform: rotate(360deg);
        }
    }
</style>
<script>
    setTimeout(() => {
        if (sessionStorage.getItem('user')) {
            window.location.href = 'dashboard.html';
        }
    }, 500);
</script>
</body>
</html>
