<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Dashboard | Products Catalog</title>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;700&family=Marcellus&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" rel="stylesheet" type="text/css">
    <link href="css/admin.css" rel="stylesheet">
</head>
<body>

<div class="admin-wrapper">
    <!-- Sidebar navigation -->
    <admin-sidebar id="admin-sidebar-container"></admin-sidebar>

    <!-- Content Workspace -->
    <div class="admin-content-area">
        <!-- Top navbar -->
        <admin-navbar title="Products Catalog"></admin-navbar>

        <!-- Main Workspace -->
        <div class="admin-main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="m-0">Manage Products</h4>
                <button class="btn btn-dark" id="add-product-btn">
                    <i class="bi bi-plus-lg me-2"></i> Add Product
                </button>
            </div>

            <!-- Filter Card -->
            <div class="card border-0 rounded-0 shadow-sm p-3 mb-4">
                <div class="row g-3">
                    <div class="col-12 col-md-4">
                        <input class="form-control" id="product-search-input" placeholder="Search by title..."
                               type="text">
                    </div>
                    <div class="col-6 col-md-3">
                        <select class="form-select" id="filter-category">
                            <option value="">All Categories</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-3">
                        <select class="form-select" id="filter-brand">
                            <option value="">All Brands</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-2">
                        <button class="btn btn-outline-dark w-100 h-100" id="reset-filters-btn">Clear</button>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="table-responsive">
                <table class="table admin-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Brand</th>
                        <th>Status</th>
                        <th>Added Date</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="products-table-body">
                    <tr>
                        <td class="text-center py-4" colspan="7">
                            <div class="spinner-border spinner-border-sm text-dark" role="status"></div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Product Save/Edit Modal -->
<div aria-hidden="true" aria-labelledby="productModalLabel" class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content rounded-0">
            <div class="modal-header">
                <h5 class="modal-title" id="productModalLabel">Add New Product</h5>
                <button aria-label="Close" class="btn-close shadow-none" data-bs-dismiss="modal" type="button"></button>
            </div>
            <div class="modal-body">
                <form id="product-form">
                    <input id="product-id" type="hidden" value="0">

                    <!-- General Details Tab Section -->
                    <div class="row g-3 mb-4">
                        <div class="col-12">
                            <label class="form-label" for="product-title">Product Title</label>
                            <input class="form-control" id="product-title" placeholder="Enter product title" required
                                   type="text">
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="product-desc">Product Description</label>
                            <textarea class="form-control" id="product-desc" placeholder="Enter product description"
                                      rows="3"></textarea>
                        </div>
                        <div class="col-12 col-sm-4">
                            <label class="form-label" for="product-category">Category</label>
                            <select class="form-select" id="product-category" required>
                                <option value="">Select Category</option>
                            </select>
                        </div>
                        <div class="col-12 col-sm-4">
                            <label class="form-label" for="product-brand">Brand</label>
                            <select class="form-select" id="product-brand" required>
                                <option value="">Select Brand</option>
                            </select>
                        </div>
                        <div class="col-12 col-sm-4">
                            <label class="form-label" for="product-status">Status</label>
                            <select class="form-select" id="product-status" required>
                                <option value="1">Active</option>
                                <option value="2">Inactive</option>
                            </select>
                        </div>
                    </div>

                    <!-- Images Upload Section -->
                    <div class="mb-4">
                        <label class="form-label d-block">Product Images</label>
                        <div class="p-4 border border-dashed text-center c-precision" id="image-drop-area"
                             style="background-color: #fafafa; border-style: dashed !important;">
                            <i class="bi bi-cloud-arrow-up fs-2 text-muted"></i>
                            <p class="mb-1 mt-2">Click to select files or drag and drop</p>
                            <small class="text-muted">Supported formats: JPG, PNG, WEBP</small>
                            <input accept="image/*" class="d-none" id="product-image-file" multiple type="file">
                        </div>
                        <div class="image-upload-preview-container" id="images-preview-list">
                            <!-- Previews dynamic -->
                        </div>
                    </div>

                    <!-- Stock Variation Matrix -->
                    <div class="mb-3">
                        <label class="form-label d-block fw-bold text-dark border-bottom pb-2">Product Stock & Pricing
                            Variations</label>

                        <!-- Variation Form -->
                        <div class="row g-2 mb-3 align-items-end" id="variation-input-row">
                            <div class="col-6 col-sm-3">
                                <label class="form-label small text-muted" for="var-color">Color</label>
                                <select class="form-select py-2" id="var-color">
                                    <option value="">Select Color</option>
                                </select>
                            </div>
                            <div class="col-6 col-sm-3">
                                <label class="form-label small text-muted" for="var-size">Size</label>
                                <select class="form-select py-2" id="var-size">
                                    <option value="">Select Size</option>
                                </select>
                            </div>
                            <div class="col-6 col-sm-2">
                                <label class="form-label small text-muted" for="var-price">Price</label>
                                <input class="form-control py-2" id="var-price" min="0" placeholder="0.00" step="0.01"
                                       type="number">
                            </div>
                            <div class="col-6 col-sm-2">
                                <label class="form-label small text-muted" for="var-qty">Quantity</label>
                                <input class="form-control py-2" id="var-qty" min="0" placeholder="0" type="number">
                            </div>
                            <div class="col-12 col-sm-2">
                                <button class="btn btn-dark py-2 w-100" id="add-variation-btn" type="button">Add
                                </button>
                            </div>
                        </div>

                        <!-- Added Variations -->
                        <div id="added-variations-container">
                            <!-- List dynamic -->
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-light" data-bs-dismiss="modal" type="button">Cancel</button>
                <button class="btn btn-dark" id="save-product-submit" type="button">Save Product</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/toastify-js" type="text/javascript"></script>

<script src="js/admin-shared.js"></script>
<script src="js/products.js"></script>
</body>
</html>
