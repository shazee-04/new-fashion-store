<!DOCTYPE html>
<html lang="en">

<head>
    <title>Account | New Fashion Store</title>

    <meta charset="utf-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="telephone=no" name="format-detection">
    <meta content="yes" name="mobile-web-app-capable">
    <meta content="shazee.dev" name="author">

    <meta content="ecommerce,fashion,store,home,clothing,accessories" name="keywords">
    <meta content="New Fashion Store - Your one-stop shop for the latest fashion trends. Discover a wide range of clothing, accessories, and more."
          name="description">

    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet">
    <script crossorigin="anonymous"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/vendor.css" rel="stylesheet" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link
            href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Marcellus&display=swap"
            rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" rel="stylesheet" type="text/css">

    <link href="css/style.css" rel="stylesheet" type="text/css">
</head>

<body class="homepage">

<header-component></header-component>

<section class="py-5 my-5 min-vh-100" id="MyAccount">
    <div class="container">
        <div class="row mb-4">
            <div class="col-12">
                <h2 class="text-uppercase mb-0 mt-0">My Account</h2>
            </div>
        </div>
        <div class="row g-4 g-lg-5">
            <div class="col-lg-3">
                <div class="card border-0 border-top rounded-0 h-100">
                    <div class="card-body px-0 py-4">
                        <div class="list-group list-group-flush bg-color-1">
                            <a class="list-group-item list-group-item-action d-flex align-items-center bg-color-1 gap-2 py-4 px-3"
                               href="#profile">
                                <i class="bi bi-person"></i>
                                Profile details
                            </a>
                            <a class="list-group-item list-group-item-action d-flex align-items-center bg-color-1 gap-2 py-4 px-3"
                               href="#addresses">
                                <i class="bi bi-geo-alt"></i>
                                Saved addresses
                            </a>
                            <a class="list-group-item list-group-item-action d-flex align-items-center bg-color-1 gap-2 py-4 px-3"
                               href="#orders">
                                <i class="bi bi-bag"></i>
                                Orders
                            </a>
                            <a class="list-group-item list-group-item-action d-flex align-items-center bg-color-1 gap-2 py-4 px-3"
                               href="#preferences">
                                <i class="bi bi-sliders"></i>
                                Preferences
                            </a>
                            <button class="btn btn-danger text-uppercase mx-3 my-2 mb-4" id="accountSignOutBtn"
                                    type="button">
                                Sign out
                            </button>
                        </div>
                        <div class="mt-4">

                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-9">
                <div class="card border-0 border-top rounded-0 mb-5 pb-5" id="profile">
                    <div class="card-body px-0 py-4">
                        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
                            <h4 class="fs-4 text-uppercase mb-0">
                                Profile details
                            </h4>
                            <button class="btn btn-dark text-uppercase" id="accountEditBtn" type="button">Edit</button>
                        </div>
                        <form class="row g-3 text-dark-emphasis" id="accountForm">
                            <div class="col-md-6">
                                <label class="form-label" for="accountFirstName">First name</label>
                                <input class="form-control rounded-0 py-2" disabled id="accountFirstName"
                                       placeholder="Ava" required
                                       type="text">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="accountLastName">Last name</label>
                                <input class="form-control rounded-0 py-2" disabled id="accountLastName"
                                       placeholder="Morgan" required
                                       type="text">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="accountEmail">Email address</label>
                                <input class="form-control rounded-0 py-2" disabled id="accountEmail"
                                       placeholder="ava.morgan@email.com"
                                       required type="email">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="accountPhone">Phone</label>
                                <input class="form-control rounded-0 py-2" disabled id="accountPhone"
                                       placeholder="+1 (555) 210-7890"
                                       required type="tel">
                            </div>
                            <div class="col-12">
                                <label class="form-label" for="accountPassword">Password</label>
                                <input class="form-control rounded-0 py-2" id="accountPassword" placeholder="••••••••"
                                       type="password">
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card border-0 rounded-0 mb-5 pb-5" id="addresses">
                    <div class="card-body px-0 py-4">
                        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
                            <h4 class="fs-4 text-uppercase mb-0">Saved addresses</h4>
                            <button class="btn btn-dark text-uppercase" id="addAddressBtn" type="button">Add new
                            </button>
                        </div>
                        <div class="row g-3" id="addressList"></div>
                        <div class="text-muted small mt-2 d-none" id="addressEmpty">No saved addresses yet.</div>
                    </div>
                </div>

                <div class="card border-0 rounded-0 mb-5 pb-5" id="orders">
                    <div class="card-body px-0 py-4">
                        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
                            <h4 class="fs-4 text-uppercase mb-0">Recent orders</h4>
                            <a class="item-anchor btn btn-dark text-uppercase" href="order-tracking.html">
                                Track <i class="bi bi-arrow-right"></i>
                            </a>
                        </div>
                        <div class="text-muted small mt-2 d-none" id="ordersEmpty">No orders yet.</div>
                        <div class="table-responsive" id="ordersTableWrap">
                            <table class="table align-middle">
                                <thead>
                                <tr class="border-bottom border-top ">
                                    <th class="text-uppercase fw-normal" scope="col">Order</th>
                                    <th class="text-uppercase fw-normal" scope="col">Date</th>
                                    <th class="text-uppercase fw-normal" scope="col">Status</th>
                                    <th class="text-uppercase fw-normal text-end" scope="col">Total</th>
                                </tr>
                                </thead>
                                <tbody id="ordersTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<footer-component></footer-component>

<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/plugins.js"></script>
<script src="https://unpkg.com/isotope-layout@3/dist/isotope.pkgd.min.js"></script>
<script src="assets/js/SmoothScroll.js"></script>
<script src="https://cdn.jsdelivr.net/npm/toastify-js" type="text/javascript"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
<script src="assets/js/script.js"></script>

<script defer src="js/helper.js"></script>
<script defer src="js/auth.js"></script>

<script defer src="js/header.js"></script>
<script defer src="js/footer.js"></script>

<script defer src="js/head.js"></script>
<script defer src="js/script.js"></script>
<script defer src="js/cart-wishlist.js"></script>
<script defer src="js/account.js"></script>

</body>

</html>
